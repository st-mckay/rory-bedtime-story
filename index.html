<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tonight's Bedtime Story</title>
  
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bedtime Story">
  <meta name="theme-color" content="#1a2f1a">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crete+Round&family=Vollkorn:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a2f1a;
      --card-bg: rgba(43, 66, 43, 0.88);
      --text-main: #f0ede6;
      --accent-title: #ffe16b;
      --text-muted: #a3b18a;
      --border: rgba(255, 255, 255, 0.12);
      --btn-bg: #3a5a40;
      --btn-hover: #588157;
      --btn-refresh: #c5832b;
      --btn-refresh-hover: #e09f3e;
    }

    body {
      margin: 0;
      padding: 24px 8px 60px 8px;
      background: radial-gradient(circle at top, #2d4a2d 0%, #1a2f1a 100%);
      color: var(--text-main);
      font-family: 'Vollkorn', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      box-sizing: border-box;
    }

    .container {
      max-width: 650px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 14px 28px 14px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      text-align: center;
    }

    .logo {
      width: 88px;
      height: 88px;
      border-radius: 20px;
      object-fit: cover;
      margin-bottom: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      border: 1px solid rgba(255, 255, 255, 0.15);
      display: inline-block;
    }

    .date {
      font-size: 0.95rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 600;
    }

    h1 {
      font-family: 'Crete Round', serif;
      font-size: 2.1rem;
      color: var(--accent-title);
      margin-top: 0;
      margin-bottom: 26px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

     .verse {
      margin-bottom: 24px;
      line-height: 1.75;
      /* Fluid typography: dynamically scales between ~0.92rem on small phones to 1.15rem on tablets/desktops */
      font-size: clamp(0.92rem, 3.8vw, 1.15rem);
      white-space: pre-line;
      letter-spacing: -0.1px;
    }

    .bottom-section {
      margin-top: 36px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .nav-controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      width: 100%;
      flex-wrap: wrap;
    }

    .action-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      width: 100%;
    }

    select, button, a.btn-link {
      background: var(--btn-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 14px;
      font-family: 'Vollkorn', serif;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
      display: inline-block;
    }

    select:hover, button:hover, a.btn-link:hover {
      background: var(--btn-hover);
    }

    select {
      max-width: 260px;
    }

    a.directory-btn {
      color: var(--accent-title);
      font-weight: 600;
      font-size: 0.95rem;
      padding: 8px 16px;
    }

    .btn-refresh {
      background: var(--btn-refresh);
      color: #fff;
      font-weight: 600;
    }

    .btn-refresh:hover {
      background: var(--btn-refresh-hover);
    }
  </style>
</head>
<body>
  <div class="container">
    <img src="apple-touch-icon.png" alt="Rory and Friends Logo" class="logo" onerror="this.style.display='none'">
    <div class="date" id="date">Tonight</div>
    <h1 id="title">Tonight's Story</h1>
    <div id="story-content">
      <p class="verse">A cozy bedtime story is on its way...</p>
    </div>

    <div class="bottom-section">
      <div class="nav-controls">
        <button id="prevBtn" onclick="changeStory(1)">‹ Older</button>
        <select id="storySelect" onchange="selectStory(this.value)"></select>
        <button id="nextBtn" onclick="changeStory(-1)">Newer ›</button>
      </div>

      <div class="action-row">
        <a href="archive.html" class="btn-link directory-btn">📚 View Directory</a>
        <button class="btn-refresh" id="refreshBtn" onclick="triggerNewStory()">✨ Refresh Story</button>
      </div>
    </div>
  </div>

  <script>
    let stories = [];
    let currentIndex = 0;

    const urlParams = new URLSearchParams(window.location.search);
    const targetStoryId = urlParams.get('story');

    async function loadStoryData() {
      try {
        const res = await fetch('stories.json?nocache=' + Date.now());
        if (res.ok) {
          const data = await res.json();
          if (Array.isArray(data) && data.length > 0) {
            stories = data;
            populateDropdown();
            findAndRenderInitialStory();
            return;
          }
        }
      } catch (e) {
        console.warn('stories.json load failed, checking story.json fallback', e);
      }

      try {
        const resSingle = await fetch('story.json?nocache=' + Date.now());
        if (resSingle.ok) {
          const single = await resSingle.json();
          if (single && (single.title || single.verses)) {
            stories = [single];
            populateDropdown();
            renderStory(0);
            return;
          }
        }
      } catch (e) {
        console.error('Failed to load stories', e);
      }

      document.getElementById('title').innerText = "Rory's Bedtime Tales";
      document.getElementById('story-content').innerHTML = `
        <p class="verse">Tonight's tale is resting. Check back soon!</p>
      `;
    }

    function findAndRenderInitialStory() {
      if (targetStoryId) {
        const foundIdx = stories.findIndex(s => s.id === targetStoryId || s.date === targetStoryId);
        renderStory(foundIdx !== -1 ? foundIdx : 0);
      } else {
        renderStory(0);
      }
    }

    function populateDropdown() {
      const select = document.getElementById('storySelect');
      select.innerHTML = '';
      stories.forEach((s, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${s.date || 'Story'}: ${s.title || 'Untitled'}`;
        select.appendChild(opt);
      });
    }

    function renderStory(index) {
      if (!stories || !stories[index]) return;
      currentIndex = index;
      const s = stories[index];

      document.getElementById('date').innerText = s.date || '';
      document.getElementById('title').innerText = s.title || "Tonight's Story";
      document.getElementById('storySelect').value = index;

      const container = document.getElementById('story-content');
      container.innerHTML = '';

      if (Array.isArray(s.verses)) {
        s.verses.forEach(verse => {
          const p = document.createElement('p');
          p.className = 'verse';
          p.textContent = verse;
          container.appendChild(p);
        });
      } else if (typeof s.verses === 'string') {
        const p = document.createElement('p');
        p.className = 'verse';
        p.textContent = s.verses;
        container.appendChild(p);
      }

      document.getElementById('prevBtn').disabled = (currentIndex >= stories.length - 1);
      document.getElementById('nextBtn').disabled = (currentIndex <= 0);
    }

    function changeStory(delta) {
      const target = currentIndex + delta;
      if (target >= 0 && target < stories.length) {
        renderStory(target);
      }
    }

    function selectStory(val) {
      renderStory(parseInt(val, 10));
    }

    function triggerNewStory() {
      // Replace with your real worker URL once ready
      const WORKER_URL = "https://rory-trigger.stuartmckay.workers.dev";

      const btn = document.getElementById('refreshBtn');
      btn.innerText = "⏳ Generating Tale...";
      btn.disabled = true;

      fetch(WORKER_URL, {
        method: 'POST',
      })
      .then(res => {
        if (res.ok) {
          alert("✨ New story requested! GitHub is writing tonight's tale now. Refresh this page in ~45 seconds.");
        } else {
          alert("Could not trigger workflow. Please verify your Cloudflare Worker URL and settings.");
        }
      })
      .catch(err => alert("Error triggering tale: " + err.message))
      .finally(() => {
        btn.innerText = "✨ Refresh Story";
        btn.disabled = false;
      });
    }

    // Execute initial load
    loadStoryData();

    // Auto-refresh when opening from background
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && !targetStoryId) {
        loadStoryData();
      }
    });
  </script>
</body>
</html>
