<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Rory's Bedtime Story</title>

  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <meta name="theme-color" content="#1a2f1a">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crete+Round&family=Vollkorn:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #1a2f1a;
      --card-bg: rgba(43, 66, 43, 0.85);
      --text-main: #f0ede6;
      --accent-title: #ffe16b;
      --text-muted: #a3b18a;
      --border: rgba(255, 255, 255, 0.1);
      --btn-bg: #3a5a40;
      --btn-hover: #588157;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: var(--bg);
      overscroll-behavior-y: contain;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      background: radial-gradient(circle at top, #2d4a2d 0%, #1a2f1a 100%);
      color: var(--text-main);
      font-family: 'Vollkorn', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      box-sizing: border-box;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
    }

    /* Pull-to-Refresh Indicator */
    .ptr-indicator {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateY(-100%);
      transition: transform 0.2s ease-out;
      z-index: 9999;
      pointer-events: none;
    }

    .ptr-spinner {
      width: 26px;
      height: 26px;
      border: 3px solid rgba(255, 225, 107, 0.2);
      border-top-color: var(--accent-title);
      border-radius: 50%;
      transition: transform 0.1s linear;
    }

    .ptr-loading .ptr-spinner {
      animation: ptr-spin 0.7s linear infinite;
    }

    @keyframes ptr-spin {
      to { transform: rotate(360deg); }
    }

    .container {
      max-width: 650px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .nav-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    a.nav-link, button.nav-btn {
      color: var(--accent-title);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      background: var(--btn-bg);
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      font-family: 'Vollkorn', serif;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    a.nav-link:hover, button.nav-btn:hover {
      background: var(--btn-hover);
    }

    h1 {
      font-family: 'Crete Round', serif;
      font-size: 2.1rem;
      color: var(--accent-title);
      margin: 0 0 8px 0;
      text-align: center;
      line-height: 1.25;
    }

    .story-meta {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .active-badge {
      background: #3a5a40;
      color: #ffe16b;
      font-size: 0.75rem;
      padding: 2px 10px;
      border-radius: 12px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-family: 'Vollkorn', serif;
      font-weight: bold;
      border: 1px solid var(--border);
    }

    .story-date {
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .verses-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .verse-card {
      background: rgba(26, 47, 26, 0.6);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      font-size: 1.08rem;
      line-height: 1.7;
      color: var(--text-main);
      white-space: pre-line;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .status-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 10px;
      font-size: 1.05rem;
    }

    #status-toast {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #2b422b;
      color: var(--accent-title);
      border: 1px solid rgba(255, 225, 107, 0.3);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      z-index: 10000;
    }
  </style>
</head>
<body>

<div id="ptr-indicator" class="ptr-indicator">
  <div class="ptr-spinner" id="ptr-spinner"></div>
</div>

<div class="container">
  <div class="top-bar">
    <div class="nav-group">
      <a href="archive.html" class="nav-link">📚 Story Directory</a>
      <a href="status.html" class="nav-link">💚 System Status</a>
      <a href="admin.html" class="nav-link">⚙️ Admin</a>
    </div>
    <div class="nav-group">
      <button class="nav-btn" onclick="loadStory(true)">↻ Refresh</button>
      <span style="font-size: 1.4rem;">🦖 🌿</span>
    </div>
  </div>

  <div id="status-toast"></div>

  <div id="story-display">
    <p class="status-msg">Loading tonight's adventure...</p>
  </div>
</div>

<script>
  function showToast(msg) {
    const toast = document.getElementById("status-toast");
    toast.textContent = msg;
    toast.style.display = "block";
    setTimeout(() => { toast.style.display = "none"; }, 3000);
  }

  async function loadStory(isManual = false) {
    const container = document.getElementById('story-display');
    try {
      const res = await fetch('stories.json?nocache=' + Date.now());
      if (!res.ok) throw new Error("Could not load story library");
      const stories = await res.json();

      if (!stories || stories.length === 0) {
        container.innerHTML = '<p class="status-msg">No bedtime stories archived yet.</p>';
        return;
      }

      // Check if a specific story ID or date was requested in query string
      const urlParams = new URLSearchParams(window.location.search);
      const requestedId = urlParams.get('story');

      let targetStory = stories[0];
      let isSpecificStory = false;

      if (requestedId) {
        const found = stories.find(s => (s.id && s.id === requestedId) || (s.date && s.date === requestedId));
        if (found) {
          targetStory = found;
          isSpecificStory = true;
        }
      }

      const title = escapeHtml(targetStory.title || "Tonight's Bedtime Story");
      const rawDate = targetStory.date || "";
      const dateDisplay = escapeHtml(rawDate.includes(',') ? rawDate.split(',')[1].trim() : rawDate);
      const badgeText = isSpecificStory ? "Archived Story" : "Tonight's Story";

      let versesHtml = "";
      if (Array.isArray(targetStory.verses) && targetStory.verses.length > 0) {
        versesHtml = targetStory.verses.map(v => `<div class="verse-card">${escapeHtml(v)}</div>`).join("");
      } else if (targetStory.content) {
        versesHtml = `<div class="verse-card">${escapeHtml(targetStory.content)}</div>`;
      } else {
        versesHtml = `<div class="verse-card" style="color: var(--text-muted); text-align: center;">Story text is being prepared...</div>`;
      }

      container.innerHTML = `
        <h1>${title}</h1>
        <div class="story-meta">
          <span class="active-badge">${badgeText}</span>
          <span class="story-date">🗓️ ${dateDisplay}</span>
        </div>
        <div class="verses-container">
          ${versesHtml}
        </div>
      `;

      if (isManual) showToast("Story refreshed!");
    } catch (err) {
      container.innerHTML = `<p class="status-msg" style="color: #f87171;">Failed to load bedtime story.<br><span style="font-size: 0.85rem; color: var(--text-muted);">${escapeHtml(err.message)}</span></p>`;
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /* Pull to Refresh */
  (function initPtr() {
    const indicator = document.getElementById('ptr-indicator');
    const spinner = document.getElementById('ptr-spinner');
    let startY = 0;
    let currentY = 0;
    let isPulling = false;
    const PULL_THRESHOLD = 70;
    const MAX_PULL = 100;

    window.addEventListener('touchstart', (e) => {
      if (window.scrollY === 0) {
        startY = e.touches[0].pageY;
        isPulling = true;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!isPulling) return;
      currentY = e.touches[0].pageY;
      const distance = currentY - startY;

      if (distance > 0 && window.scrollY === 0) {
        const pullDistance = Math.min(distance * 0.4, MAX_PULL);
        indicator.style.transform = `translateY(${pullDistance}px)`;
        spinner.style.transform = `rotate(${pullDistance * 3.5}deg)`;
        if (e.cancelable) e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchend', async () => {
      if (!isPulling) return;
      isPulling = false;

      const pullDistance = (currentY - startY) * 0.4;
      if (pullDistance >= PULL_THRESHOLD && window.scrollY === 0) {
        indicator.style.transform = `translateY(${PULL_THRESHOLD}px)`;
        indicator.classList.add('ptr-loading');
        try {
          await loadStory(true);
        } finally {
          setTimeout(() => {
            indicator.classList.remove('ptr-loading');
            indicator.style.transform = 'translateY(-100%)';
          }, 350);
        }
      } else {
        indicator.style.transform = 'translateY(-100%)';
      }
      startY = 0;
      currentY = 0;
    });
  })();

  document.addEventListener("DOMContentLoaded", () => {
    loadStory(false);
  });
</script>

</body>
</html>
