<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tonight's Bedtime Story</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crete+Round&family=Vollkorn:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a2f1a;
      --card-bg: rgba(43, 66, 43, 0.85);
      --text-main: #f0ede6;
      --accent-title: #ffe16b;
      --text-muted: #a3b18a;
      --border: rgba(255, 255, 255, 0.1);
      --btn-bg: #3a5a40;
      --btn-hover: #588157;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      background: radial-gradient(circle at top, #2d4a2d 0%, #1a2f1a 100%);
      color: var(--text-main);
      font-family: 'Vollkorn', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
    }

    .container {
      max-width: 650px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      text-align: center;
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    a.archive-btn {
      color: var(--accent-title);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      background: var(--btn-bg);
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: background 0.2s;
    }

    a.archive-btn:hover {
      background: var(--btn-hover);
    }

    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
      flex-wrap: wrap;
    }

    select, button {
      background: var(--btn-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-family: 'Vollkorn', serif;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.2s;
    }

    select:hover, button:hover {
      background: var(--btn-hover);
    }

    .date {
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    h1 {
      font-family: 'Crete Round', serif;
      font-size: 2.1rem;
      color: var(--accent-title);
      margin-top: 0;
      margin-bottom: 24px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .verse {
      margin-bottom: 20px;
      line-height: 1.8;
      font-size: 1.1rem;
      white-space: pre-line;
    }

    .icon {
      font-size: 2rem;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-nav">
      <a href="archive.html" class="archive-btn">📚 Story Directory</a>
      <span style="font-size: 0.85rem; color: var(--text-muted);">Nightly Tales</span>
    </div>

    <div class="header-nav">
      <button id="prevBtn" onclick="changeStory(1)">‹ Older</button>
      <select id="storySelect" onchange="selectStory(this.value)"></select>
      <button id="nextBtn" onclick="changeStory(-1)">Newer ›</button>
    </div>

    <div class="icon">🌿 🌱</div>
    <div class="date" id="date">Tonight</div>
    <h1 id="title">Tonight's Story</h1>
    <div id="story-content">
      <p class="verse">A cozy bedtime story is on its way...</p>
    </div>
  </div>

  <script>
    let stories = [];
    let currentIndex = 0;

    const urlParams = new URLSearchParams(window.location.search);
    const targetStoryId = urlParams.get('story');

    async function loadStoryData() {
      try {
        const resStories = await fetch('stories.json?nocache=' + Date.now());
        if (resStories.ok) {
          const data = await resStories.json();
          if (Array.isArray(data) && data.length > 0) {
            stories = data;
            populateDropdown();
            findAndRenderInitialStory();
            return;
          }
        }
      } catch (e) {
        console.warn('Could not load stories.json, trying story.json');
      }

      try {
        const resSingle = await fetch('story.json?nocache=' + Date.now());
        if (resSingle.ok) {
          const single = await resSingle.json();
          if (single && (single.title || single.verses)) {
            stories = [single];
            populateDropdown();
            renderStory(0);
            return;
          }
        }
      } catch (e) {
        console.warn('Could not load story.json');
      }

      document.getElementById('title').innerText = "Rory's Bedtime Tales";
      document.getElementById('story-content').innerHTML = `
        <p class="verse">Tonight's tale is resting. Check back soon!</p>
      `;
    }

    function findAndRenderInitialStory() {
      if (targetStoryId) {
        const foundIdx = stories.findIndex(s => s.id === targetStoryId || s.date === targetStoryId);
        renderStory(foundIdx !== -1 ? foundIdx : 0);
      } else {
        renderStory(0);
      }
    }

    function populateDropdown() {
      const select = document.getElementById('storySelect');
      select.innerHTML = '';
      stories.forEach((s, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${s.date || 'Story'}: ${s.title || 'Untitled'}`;
        select.appendChild(opt);
      });
    }

    function renderStory(index) {
      if (!stories[index]) return;
      currentIndex = index;
      const s = stories[index];

      document.getElementById('date').innerText = s.date || '';
      document.getElementById('title').innerText = s.title || "Tonight's Story";
      document.getElementById('storySelect').value = index;

      const container = document.getElementById('story-content');
      container.innerHTML = '';

      if (Array.isArray(s.verses)) {
        s.verses.forEach(verse => {
          const p = document.createElement('p');
          p.className = 'verse';
          p.textContent = verse;
          container.appendChild(p);
        });
      } else if (typeof s.verses === 'string') {
        const p = document.createElement('p');
        p.className = 'verse';
        p.textContent = s.verses;
        container.appendChild(p);
      }

      document.getElementById('prevBtn').disabled = (currentIndex >= stories.length - 1);
      document.getElementById('nextBtn').disabled = (currentIndex <= 0);
    }

    function changeStory(delta) {
      const target = currentIndex + delta;
      if (target >= 0 && target < stories.length) {
        renderStory(target);
      }
    }

    function selectStory(val) {
      renderStory(parseInt(val, 10));
    }

    loadStoryData();
  </script>
</body>
</html>
