<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#166534">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Rory's Bedtime Story</title>
  <style>
    :root {
      --bg-color: #f0fdf4;
      --card-bg: #ffffff;
      --card-border: #bbf7d0;
      --text-main: #14532d;
      --text-muted: #166534;
      --accent-green: #15803d;
      --accent-green-hover: #166534;
      --badge-bg: #dcfce7;
      --badge-text: #15803d;
      --verse-bg: #f8fafc;
      --verse-border: #86efac;
      --story-text: #1e293b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Keep the background green when rubber-banding on mobile */
    html {
      background-color: var(--bg-color);
      overscroll-behavior-y: contain;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 32px 16px;
      line-height: 1.6;
      min-height: 100vh;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
    }

    /* Pull-to-Refresh Indicator */
    .ptr-indicator {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateY(-100%);
      transition: transform 0.2s ease-out;
      z-index: 9999;
      pointer-events: none;
    }

    .ptr-spinner {
      width: 26px;
      height: 26px;
      border: 3px solid rgba(22, 101, 52, 0.2);
      border-top-color: var(--accent-green);
      border-radius: 50%;
      transition: transform 0.1s linear;
    }

    .ptr-loading .ptr-spinner {
      animation: ptr-spin 0.7s linear infinite;
    }

    @keyframes ptr-spin {
      to { transform: rotate(360deg); }
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    /* Top Navigation Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-title h1 {
      font-size: 1.65rem;
      font-weight: 800;
      color: var(--accent-green);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-title p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-top: 4px;
    }

    .action-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 9999px;
      text-decoration: none;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
    }

    .btn-secondary {
      background: #ffffff;
      color: var(--text-main);
      border-color: var(--card-border);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .btn-secondary:hover {
      background: #f0fdf4;
      border-color: #86efac;
    }

    .btn-primary {
      background: var(--accent-green);
      color: #ffffff;
      box-shadow: 0 2px 4px rgba(21, 128, 61, 0.2);
    }

    .btn-primary:hover {
      background: var(--accent-green-hover);
    }

    /* Story Card */
    .story-card {
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 20px;
      padding: 32px 26px;
      box-shadow: 0 10px 25px -5px rgba(22, 101, 52, 0.08);
      margin-bottom: 24px;
    }

    .story-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 12px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      background: var(--badge-bg);
      color: var(--badge-text);
      border: 1px solid var(--card-border);
    }

    .story-date {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 600;
    }

    .story-title {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--accent-green);
      margin-bottom: 24px;
      line-height: 1.3;
    }

    .verse-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .verse-block {
      background: var(--verse-bg);
      border-left: 4px solid var(--verse-border);
      border-radius: 0 12px 12px 0;
      padding: 16px 20px;
      font-size: 1.05rem;
      color: var(--story-text);
      white-space: pre-line;
      line-height: 1.7;
    }

    /* Loading and Empty State */
    .state-message {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 1rem;
      font-weight: 500;
    }

    /* Toast */
    #status-toast {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text-main);
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
      z-index: 10000;
    }
  </style>
</head>
<body>

<div id="ptr-indicator" class="ptr-indicator">
  <div class="ptr-spinner" id="ptr-spinner"></div>
</div>

<div class="container">
  <div class="top-bar">
    <div class="header-title">
      <h1>🦖 Rory's Bedtime Story</h1>
      <p>Tonight's rhyming dinosaur adventure.</p>
    </div>
    <div class="action-group">
      <a href="directory.html" class="btn btn-secondary">📚 Archive</a>
      <a href="health.html" class="btn btn-secondary">💚 Health</a>
      <a href="admin.html" class="btn btn-secondary">⚙️ Admin</a>
      <button class="btn btn-primary" onclick="loadLatestStory(true)">↻ Refresh</button>
    </div>
  </div>

  <div id="status-toast"></div>

  <div class="story-card" id="story-card">
    <div id="story-content">
      <div class="state-message">Loading tonight's adventure...</div>
    </div>
  </div>
</div>

<script>
  function showToast(message) {
    const toast = document.getElementById("status-toast");
    toast.textContent = message;
    toast.style.display = "block";
    setTimeout(() => { toast.style.display = "none"; }, 3000);
  }

  async function loadLatestStory(showFeedback = false) {
    const content = document.getElementById("story-content");
    try {
      const res = await fetch(`stories.json?t=${Date.now()}`);
      if (!res.ok) throw new Error("Could not load stories archive");
      
      const stories = await res.json();
      if (!stories || stories.length === 0) {
        content.innerHTML = `<div class="state-message">No bedtime stories available yet. Check back soon!</div>`;
        return;
      }

      const latest = stories[0];
      const dateDisplay = latest.date ? escapeHtml(latest.date) : "Latest Story";
      const titleDisplay = latest.title ? escapeHtml(latest.title) : "Rory's Bedtime Adventure";
      
      let versesHtml = "";
      if (Array.isArray(latest.verses) && latest.verses.length > 0) {
        versesHtml = latest.verses.map(verse => `
          <div class="verse-block">${escapeHtml(verse)}</div>
        `).join("");
      } else if (latest.content) {
        versesHtml = `<div class="verse-block">${escapeHtml(latest.content)}</div>`;
      } else {
        versesHtml = `<div class="verse-block" style="color: var(--text-muted);">Story text is being prepared...</div>`;
      }

      content.innerHTML = `
        <div class="story-meta">
          <span class="badge">🦖 Latest Adventure</span>
          <span class="story-date">📅 ${dateDisplay}</span>
        </div>
        <h2 class="story-title">${titleDisplay}</h2>
        <div class="verse-container">
