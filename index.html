<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1120">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Rory's Bedtime Story</title>
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-blue-hover: #0ea5e9;
      --success-bg: rgba(34, 197, 94, 0.15);
      --success-text: #4ade80;
      --story-text: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    /* Prevent white rubber-band bounce on iOS/Safari */
    html {
      background-color: var(--bg-color);
      overscroll-behavior-y: contain;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 32px 16px;
      line-height: 1.6;
      min-height: 100vh;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
    }

    /* Pull-to-Refresh Indicator */
    .ptr-indicator {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateY(-100%);
      transition: transform 0.2s ease-out;
      z-index: 9999;
      pointer-events: none;
      background-color: transparent;
    }

    .ptr-spinner {
      width: 26px;
      height: 26px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      transition: transform 0.1s linear;
    }

    .ptr-loading .ptr-spinner {
      animation: ptr-spin 0.7s linear infinite;
    }

    @keyframes ptr-spin {
      to { transform: rotate(360deg); }
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
    }

    /* Top Navigation Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-title h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-title p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .action-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
    }

    .btn-secondary {
      background: var(--card-bg);
      color: var(--text-main);
      border-color: var(--card-border);
    }

    .btn-secondary:hover {
      background: #283548;
      border-color: #475569;
    }

    .btn-primary {
      background: var(--accent-blue);
      color: #0b1120;
    }

    .btn-primary:hover {
      background: var(--accent-blue-hover);
    }

    /* Story Card */
    .story-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 32px 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
      margin-bottom: 24px;
    }

    .story-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }

    .badge-success {
      background: var(--success-bg);
      color: var(--success-text);
    }

    .story-date {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .story-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent-blue);
      margin-bottom: 24px;
      line-height: 1.3;
    }

    .verse-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .verse-block {
      background: rgba(15, 23, 42, 0.4);
      border-left: 3px solid var(--accent-blue);
      border-radius: 0 8px 8px 0;
      padding: 14px 18px;
      font-size: 1.05rem;
      color: var(--story-text);
      white-space: pre-line;
      line-height: 1.7;
    }

    /* Loading and Empty State */
    .state-message {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* Toast */
    #status-toast {
      display: none;
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: var(--text-main);
      border: 1px solid var(--card-border);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.4);
      z-index: 10000;
    }
  </style>
</head>
<body>

<div id="ptr-indicator" class="ptr-indicator">
  <div class="ptr-spinner" id="ptr-spinner"></div>
</div>

<div class="container">
  <div class="top-bar">
    <div class="header-title">
      <h1>🦖 Rory's Bedtime Story</h1>
      <p>Tonight's rhyming dinosaur adventure.</p>
    </div>
    <div class="action-group">
      <a href="directory.html" class="btn btn-secondary">📚 Archive</a>
      <a href="health.html" class="btn btn-secondary">💚 Health</a>
      <a href="admin.html" class="btn btn-secondary">⚙️ Admin</a>
      <button class="btn btn-primary" onclick="loadLatestStory(true)">↻ Refresh</button>
    </div>
  </div>

  <div id="status-toast"></div>

  <div class="story-card" id="story-card">
    <div id="story-content">
      <div class="state-message">Loading tonight's adventure...</div>
    </div>
  </div>
</div>

<script>
  function showToast(message) {
    const toast = document.getElementById("status-toast");
    toast.textContent = message;
    toast.style.display = "block";
    setTimeout(() => { toast.style.display = "none"; }, 3000);
  }

  async function loadLatestStory(showFeedback = false) {
    const content = document.getElementById("story-content");
    try {
      const res = await fetch(`stories.json?t=${Date.now()}`);
      if (!res.ok) throw new Error("Could not load stories archive");
      
      const stories = await res.json();
      if (!stories || stories.length === 0) {
        content.innerHTML = `<div class="state-message">No bedtime stories available yet. Check back soon!</div>`;
        return;
      }

      const latest = stories[0];
      const dateDisplay = latest.date ? escapeHtml(latest.date) : "Latest Story";
      const titleDisplay = latest.title ? escapeHtml(latest.title) : "Rory's Bedtime Adventure";
      
      let versesHtml = "";
      if (Array.isArray(latest.verses) && latest.verses.length > 0) {
        versesHtml = latest.verses.map(verse => `
          <div class="verse-block">${escapeHtml(verse)}</div>
        `).join("");
      } else if (latest.content) {
        versesHtml = `<div class="verse-block">${escapeHtml(latest.content)}</div>`;
      } else {
        versesHtml = `<div class="verse-block" style="color: var(--text-muted);">Story text is being prepared...</div>`;
      }

      content.innerHTML = `
        <div class="story-meta">
          <span class="badge badge-success">Latest Adventure</span>
          <span class="story-date">📅 ${dateDisplay}</span>
        </div>
        <h2 class="story-title">${titleDisplay}</h2>
        <div class="verse-container">
          ${versesHtml}
        </div>
      `;

      if (showFeedback) {
        showToast("Story updated to latest.");
      }
    } catch (err) {
      content.innerHTML = `
        <div class="state-message" style="color: #f87171;">
          Failed to load tonight's story.<br>
          <span style="font-size: 0.85rem; color: var(--text-muted);">${escapeHtml(err.message)}</span>
        </div>
      `;
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /* PULL TO REFRESH IMPLEMENTATION */
  (function initPullToRefresh() {
    const indicator = document.getElementById('ptr-indicator');
    const spinner = document.getElementById('ptr-spinner');
    
    let startY = 0;
    let currentY = 0;
    let isPulling = false;
    const PULL_THRESHOLD = 70;
    const MAX_PULL = 100;

    window.addEventListener('touchstart', (e) => {
      if (window.scrollY === 0) {
        startY = e.touches[0].pageY;
        isPulling = true;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!isPulling) return;

      currentY = e.touches[0].pageY;
      const distance = currentY - startY;

      if (distance > 0 && window.scrollY === 0) {
        const pullDistance = Math.min(distance * 0.4, MAX_PULL);
        indicator.style.transform = `translateY(${pullDistance}px)`;
        spinner.style.transform = `rotate(${pullDistance * 3.5}deg)`;
        if (e.cancelable) e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchend', async () => {
      if (!isPulling) return;
      isPulling = false;

      const distance = currentY - startY;
      const pullDistance = distance * 0.4;

      if (pullDistance >= PULL_THRESHOLD && window.scrollY === 0) {
        indicator.style.transform = `translateY(${PULL_THRESHOLD}px)`;
        indicator.classList.add('ptr-loading');

        try {
          await loadLatestStory(true);
        } finally {
          setTimeout(() => {
            indicator.classList.remove('ptr-loading');
            indicator.style.transform = 'translateY(-100%)';
          }, 350);
        }
      } else {
        indicator.style.transform = 'translateY(-100%)';
      }

      startY = 0;
      currentY = 0;
    });
  })();

  document.addEventListener("DOMContentLoaded", () => {
    loadLatestStory(false);
  });
</script>

</body>
</html>
