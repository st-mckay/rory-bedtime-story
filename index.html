<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Rory's Bedtime Story</title>

  <!-- App Icon & Shortcut Settings -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <meta name="theme-color" content="#1a2f1a">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crete+Round&family=Vollkorn:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style-theme.css">
</head>
<body>

<!-- Pull to Refresh Indicator -->
<div id="ptr-indicator" class="ptr-indicator">
  <div class="ptr-spinner" id="ptr-spinner"></div>
</div>

<div class="container">
  <!-- Centered Logo -->
  <div class="header-logo">
    <img src="apple-touch-icon.png" alt="Rory Bedtime Story Logo" class="app-logo">
  </div>

  <div id="status-toast"></div>

  <!-- Story Display -->
  <div id="story-display">
    <p class="status-msg">Loading tonight's adventure...</p>
  </div>

  <!-- Story Rating Component -->
  <div class="rating-bar" id="rating-bar" style="display: none;">
    <span class="rating-prompt">How was tonight's adventure?</span>
    <div class="rating-buttons">
      <button class="btn-rate" id="rate-up" onclick="submitRating(1)" aria-label="Thumbs Up">👍</button>
      <button class="btn-rate" id="rate-down" onclick="submitRating(-1)" aria-label="Thumbs Down">👎</button>
    </div>
  </div>

  <!-- Story Navigation Controls -->
  <div class="story-controls" id="story-controls" style="display: none;">
    <div class="pagination-row">
      <button id="btn-newer" class="btn-nav" onclick="navigateStory(-1)">« Newer Tale</button>
      <button id="btn-older" class="btn-nav" onclick="navigateStory(1)">Older Tale »</button>
    </div>

    <div class="select-container">
      <select id="story-dropdown" class="story-select" onchange="onSelectStory(this.value)">
        <option value="" disabled selected>📜 Choose from the last 30 stories...</option>
      </select>
    </div>
  </div>

  <!-- Bottom Navigation Links -->
  <div class="bottom-bar">
    <a href="archive.html" class="nav-link">📚 Story Archive</a>
    <a href="status.html" class="nav-link">💚 System Status</a>
    <a href="admin.html" class="nav-link">⚙️ Admin</a>
    <button class="nav-btn" onclick="fetchStories(true)">↻ Refresh</button>
  </div>
</div>

<script>
  const WORKER_ENDPOINT = "https://rory-trigger.stuartmckay.workers.dev";
  let allStories = [];
  let currentIndex = 0;
  let feedbackMap = {};

  function showToast(msg) {
    const toast = document.getElementById("status-toast");
    toast.textContent = msg;
    toast.style.display = "block";
    setTimeout(() => { toast.style.display = "none"; }, 3000);
  }

  async function fetchStories(isManual = false) {
    const container = document.getElementById('story-display');
    try {
      // 1. Fetch stories archive and D1 ratings concurrently
      const [storiesRes, feedbackRes] = await Promise.all([
        fetch('stories.json?nocache=' + Date.now()),
        fetch(`${WORKER_ENDPOINT}/feedback-all`).catch(() => null)
      ]);

      if (!storiesRes.ok) throw new Error("Could not load story library");
      allStories = await storiesRes.json();

      if (feedbackRes && feedbackRes.ok) {
        feedbackMap = await feedbackRes.json();
      } else {
        feedbackMap = {};
        allStories.forEach(s => {
          const sid = s.id || s.date;
          const cached = localStorage.getItem(`rating_${sid}`);
          if (cached) feedbackMap[sid] = parseInt(cached, 10);
        });
      }

      if (!allStories || allStories.length === 0) {
        container.innerHTML = '<p class="status-msg">No bedtime stories archived yet.</p>';
        document.getElementById('story-controls').style.display = 'none';
        document.getElementById('rating-bar').style.display = 'none';
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      const requestedId = urlParams.get('story');

      if (requestedId) {
        const foundIndex = allStories.findIndex(s => (s.id && s.id === requestedId) || (s.date && s.date === requestedId));
        currentIndex = foundIndex !== -1 ? foundIndex : 0;
      } else {
        currentIndex = 0;
      }

      populateDropdown();
      renderCurrentStory();
      document.getElementById('story-controls').style.display = 'flex';
      document.getElementById('rating-bar').style.display = 'flex';

      if (isManual) showToast("Story refreshed!");
    } catch (err) {
      container.innerHTML = `<p class="status-msg" style="color: #f87171;">Failed to load bedtime story.<br><span style="font-size: 0.85em; color: var(--text-muted);">${escapeHtml(err.message)}</span></p>`;
    }
  }

  function populateDropdown() {
    const dropdown = document.getElementById('story-dropdown');
    dropdown.innerHTML = '';

    const recent30 = allStories.slice(0, 30);
    recent30.forEach((story, idx) => {
      const opt = document.createElement('option');
      opt.value = idx;
      const sid = story.id || story.date;
      const rating = feedbackMap[sid];

      let prefix = "";
      if (rating === 1) prefix = "👍 ";
      else if (rating === -1) prefix = "👎 ";

      const rawDate = story.date || '';
      const datePart = rawDate.includes(',') ? rawDate.split(',')[1].trim() : rawDate;
      opt.textContent = `${idx === 0 ? '✨ Tonight: ' : ''}${prefix}${story.title || 'Untitled'} (${datePart})`;
      dropdown.appendChild(opt);
    });
  }

  function renderCurrentStory() {
    const container = document.getElementById('story-display');
    const targetStory = allStories[currentIndex];
    if (!targetStory) return;

    const title = escapeHtml(targetStory.title || "Tonight's Bedtime Story");
    const rawDate = targetStory.date || "";
    const dateDisplay = escapeHtml(rawDate.includes(',') ? rawDate.split(',')[1].trim() : rawDate);
    const badgeText = currentIndex === 0 ? "Tonight's Story" : "Archived Story";
    const schemeBadge = targetStory.rhyme_scheme ? `<span class="scheme-badge">${escapeHtml(targetStory.rhyme_scheme)}</span>` : "";

    let versesHtml = "";
    if (Array.isArray(targetStory.verses) && targetStory.verses.length > 0) {
      versesHtml = targetStory.verses.map(v => `<div class="verse-text">${escapeHtml(v)}</div>`).join("");
    } else if (targetStory.content) {
      versesHtml = `<div class="verse-text">${escapeHtml(targetStory.content)}</div>`;
    } else {
      versesHtml = `<div class="verse-text" style="color: var(--text-muted);">Story text is being prepared...</div>`;
    }

    container.innerHTML = `
      <h1>${title}</h1>
      <div class="story-meta">
        <span class="active-badge">${badgeText}</span>
        <span class="story-date">🗓️ ${dateDisplay}</span>
        ${schemeBadge}
      </div>
      <div class="verses-container">
        ${versesHtml}
      </div>
    `;

    document.getElementById('btn-newer').disabled = (currentIndex <= 0);
    document.getElementById('btn-older').disabled = (currentIndex >= allStories.length - 1);

    const dropdown = document.getElementById('story-dropdown');
    if (currentIndex < 30) {
      dropdown.value = currentIndex;
    } else {
      dropdown.selectedIndex = -1;
    }

    syncRatingButtons();
  }

  function syncRatingButtons() {
    const targetStory = allStories[currentIndex];
    if (!targetStory) return;

    const storyId = targetStory.id || targetStory.date;
    const currentRating = feedbackMap[storyId] || parseInt(localStorage.getItem(`rating_${storyId}`), 10) || 0;

    const upBtn = document.getElementById('rate-up');
    const downBtn = document.getElementById('rate-down');

    upBtn.classList.toggle('active', currentRating === 1);
    downBtn.classList.toggle('active', currentRating === -1);
  }

  async function submitRating(rating) {
    const targetStory = allStories[currentIndex];
    if (!targetStory) return;

    const storyId = targetStory.id || targetStory.date;
    const title = targetStory.title || "Untitled";

    const currentRating = feedbackMap[storyId] || parseInt(localStorage.getItem(`rating_${storyId}`), 10) || 0;
    const finalRating = currentRating === rating ? 0 : rating;

    feedbackMap[storyId] = finalRating;
    if (finalRating === 0) {
      localStorage.removeItem(`rating_${storyId}`);
    } else {
      localStorage.setItem(`rating_${storyId}`, finalRating);
    }

    syncRatingButtons();
    populateDropdown();
    if (currentIndex < 30) {
      document.getElementById('story-dropdown').value = currentIndex;
    }

    try {
      const res = await fetch(WORKER_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "rate_story",
          story_id: storyId,
          title: title,
          rating: finalRating
        })
      });

      if (!res.ok) throw new Error("Server rejected rating");
      showToast(finalRating === 1 ? "Added to favourites! 👍" : (finalRating === -1 ? "Feedback recorded! 👎" : "Rating removed."));
    } catch (err) {
      showToast("Saved locally (offline). Will sync when online.");
    }
  }

  function navigateStory(direction) {
    const newIdx = currentIndex + direction;
    if (newIdx >= 0 && newIdx < allStories.length) {
      currentIndex = newIdx;
      renderCurrentStory();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function onSelectStory(indexValue) {
    const idx = parseInt(indexValue, 10);
    if (!isNaN(idx) && idx >= 0 && idx < allStories.length) {
      currentIndex = idx;
      renderCurrentStory();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /* Pull to Refresh */
  (function initPtr() {
    const indicator = document.getElementById('ptr-indicator');
    const spinner = document.getElementById('ptr-spinner');
    let startY = 0;
    let currentY = 0;
    let isPulling = false;
    const PULL_THRESHOLD = 70;
    const MAX_PULL = 100;

    window.addEventListener('touchstart', (e) => {
      if (window.scrollY === 0) {
        startY = e.touches[0].pageY;
        isPulling = true;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!isPulling) return;
      currentY = e.touches[0].pageY;
      const distance = currentY - startY;

      if (distance > 0 && window.scrollY === 0) {
        const pullDistance = Math.min(distance * 0.4, MAX_PULL);
        indicator.style.transform = `translateY(${pullDistance}px)`;
        spinner.style.transform = `rotate(${pullDistance * 3.5}deg)`;
        if (e.cancelable) e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchend', async () => {
      if (!isPulling) return;
      isPulling = false;

      const pullDistance = (currentY - startY) * 0.4;
      if (pullDistance >= PULL_THRESHOLD && window.scrollY === 0) {
        indicator.style.transform = `translateY(${PULL_THRESHOLD}px)`;
        indicator.classList.add('ptr-loading');
        try {
          await fetchStories(true);
        } finally {
          setTimeout(() => {
            indicator.classList.remove('ptr-loading');
            indicator.style.transform = 'translateY(-100%)';
          }, 350);
        }
      } else {
        indicator.style.transform = 'translateY(-100%)';
      }
      startY = 0;
      currentY = 0;
    });
  })();

  /* Service Worker Registration with Immediate Update Check */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js')
        .then((reg) => {
          reg.update();
        })
        .catch(err => console.warn('Service Worker registration failed:', err));
    });
  }

  document.addEventListener("DOMContentLoaded", () => {
    fetchStories(false);
  });
</script>

</body>
</html>
