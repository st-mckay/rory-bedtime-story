<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Rory's Bedtime Tales</title>

  <!-- PWA & Mobile Web Clip Settings -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <meta name="theme-color" content="#1a2f1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crete+Round&family=Vollkorn:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #1a2f1a;
      --card-bg: rgba(43, 66, 43, 0.85);
      --text-main: #f0ede6;
      --accent-title: #ffe16b;
      --text-muted: #a3b18a;
      --border: rgba(255, 255, 255, 0.1);
      --btn-bg: #3a5a40;
      --btn-hover: #588157;
      --select-bg: #243b24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: var(--bg);
      overscroll-behavior-y: contain;
      -webkit-text-size-adjust: auto;
      text-size-adjust: auto;
    }

    body {
      margin: 0;
      padding: calc(env(safe-area-inset-top, 20px) + 14px) 14px calc(env(safe-area-inset-bottom, 20px) + 20px) 14px;
      background: radial-gradient(circle at top, #2d4a2d 0%, #1a2f1a 100%);
      color: var(--text-main);
      font-family: ui-serif, -apple-system-ui-serif, "New York", "Vollkorn", serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      box-sizing: border-box;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
    }

    /* Pull to Refresh Indicator */
    .ptr-indicator {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateY(-100%);
      transition: transform 0.2s ease-out;
      z-index: 9999;
      pointer-events: none;
    }

    .ptr-spinner {
      width: 26px;
      height: 26px;
      border: 3px solid rgba(255, 225, 107, 0.2);
      border-top-color: var(--accent-title);
      border-radius: 50%;
      transition: transform 0.1s linear;
    }

    .ptr-loading .ptr-spinner {
      animation: ptr-spin 0.7s linear infinite;
    }

    @keyframes ptr-spin {
      to { transform: rotate(360deg); }
    }

    .container {
      max-width: 650px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 26px 20px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    .header-logo {
      text-align: center;
      margin-bottom: 14px;
    }

    .app-logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      display: inline-block;
      object-fit: cover;
    }

    /* Story Selector Dropdown */
    .selector-box {
      margin-bottom: 18px;
      position: relative;
    }

    .story-select {
      width: 100%;
      background: var(--select-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='10' viewBox='0 0 14 10'%3E%3Cpath fill='%23ffe16b' d='M7 10L0 0h14z'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 10px 7px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .story-select:focus {
      border-color: var(--accent-title);
    }

    /* Header & Story Meta */
    .story-header {
      text-align: center;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }

    h1.story-title {
      font-family: ui-serif, -apple-system-ui-serif, "New York", "Crete Round", serif;
      font-size: 2rem;
      color: var(--accent-title);
      margin: 0 0 6px 0;
      line-height: 1.25;
    }

    .story-date-line {
      color: var(--text-muted);
      font-size: 0.92rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }

    .scheme-badge {
      background: #3a5a40;
      color: #ffe16b;
      font-size: 0.7rem;
      padding: 2px 7px;
      border-radius: 6px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* Verses Area */
    .verse-container {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin-bottom: 24px;
    }

    .verse-card {
      background: rgba(26, 47, 26, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 14px 18px;
      line-height: 1.7;
      font-size: 1.06rem;
      text-align: center;
      letter-spacing: 0.015em;
    }

    .verse-line {
      display: block;
    }

    /* Interactive Feedback Bar */
    .feedback-area {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      padding: 14px;
      background: rgba(26, 47, 26, 0.6);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 24px;
    }

    .feedback-label {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-right: 4px;
    }

    .btn-feedback {
      background: var(--btn-bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 14px;
      font-size: 1.2rem;
      cursor: pointer;
      line-height: 1;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .btn-feedback:hover {
      background: var(--btn-hover);
    }

    .btn-feedback.active-like {
      background: #ffe16b;
      border-color: #ffe16b;
      transform: scale(1.12);
      box-shadow: 0 0 12px rgba(255, 225, 107, 0.4);
    }

    .btn-feedback.active-dislike {
      background: #f87171;
      border-color: #f87171;
      transform: scale(1.12);
      box-shadow: 0 0 12px rgba(248, 113, 113, 0.4);
    }

    /* Bottom Navigation Bar */
    .bottom-bar {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .nav-btn {
      color: var(--accent-title);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      background: var(--btn-bg);
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: background 0.15s;
    }

    .nav-btn:hover {
      background: var(--btn-hover);
    }

    #status-toast {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #2b422b;
      color: var(--accent-title);
      border: 1px solid rgba(255, 225, 107, 0.3);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      z-index: 10000;
    }

    .loading-box {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 10px;
      font-size: 1.05rem;
    }
  </style>
</head>
<body>

<!-- Pull to Refresh Indicator -->
<div id="ptr-indicator" class="ptr-indicator">
  <div class="ptr-spinner" id="ptr-spinner"></div>
</div>

<div class="container">
  <div class="header-logo">
    <img src="apple-touch-icon.png" alt="Rory Bedtime Story Logo" class="app-logo">
  </div>

  <div id="status-toast"></div>

  <!-- Story Selector Dropdown -->
  <div class="selector-box">
    <select id="story-selector" class="story-select" onchange="onStorySelected(this.value)">
      <option value="">Loading tales...</option>
    </select>
  </div>

  <main id="story-display">
    <div class="loading-box">Opening Rory's bedtime book...</div>
  </main>

  <!-- Bottom Navigation Links -->
  <div class="bottom-bar">
    <a href="archive.html" class="nav-btn">📚 Tale Directory</a>
    <a href="status.html" class="nav-btn">💚 System Status</a>
    <a href="admin.html" class="nav-btn">⚙️ Admin</a>
    <button class="nav-btn" onclick="initPage(true)">↻ Refresh</button>
  </div>
</div>

<script>
  const WORKER_ENDPOINT = "https://rory-trigger.stuartmckay.workers.dev";
  let stories = [];
  let currentStory = null;
  let feedbackMap = {};

  function showToast(msg) {
    const toast = document.getElementById("status-toast");
    toast.textContent = msg;
    toast.style.display = "block";
    setTimeout(() => { toast.style.display = "none"; }, 3000);
  }

  async function initPage(isManual = false) {
    try {
      const [storiesRes, feedbackRes] = await Promise.all([
        fetch(`stories.json?t=${Date.now()}`),
        fetch(`${WORKER_ENDPOINT}/feedback-all`).catch(() => null)
      ]);

      if (!storiesRes.ok) throw new Error("Could not load stories archive");
      stories = await storiesRes.json();

      if (feedbackRes && feedbackRes.ok) {
        feedbackMap = await feedbackRes.json();
      } else {
        feedbackMap = {};
        stories.forEach(s => {
          const sid = s.id || s.date;
          const cachedRating = localStorage.getItem(`rating_${sid}`);
          if (cachedRating) feedbackMap[sid] = parseInt(cachedRating, 10);
        });
      }

      if (!stories || stories.length === 0) {
        document.getElementById("story-display").innerHTML = '<div class="loading-box">No stories found. Generate one in Admin!</div>';
        return;
      }

      populateDropdown();

      // Check URL search params for a deep-linked story ID
      const urlParams = new URLSearchParams(window.location.search);
      const requestedId = urlParams.get("story");

      if (requestedId) {
        const found = stories.find(s => (s.id || s.date) === requestedId);
        currentStory = found || stories[0];
      } else {
        currentStory = stories[0];
      }

      document.getElementById("story-selector").value = currentStory.id || currentStory.date;
      renderStory(currentStory);

      if (isManual) showToast("Story refreshed!");
    } catch (err) {
      document.getElementById("story-display").innerHTML = `<div class="loading-box" style="color: #f87171;">Failed to load story: ${escapeHtml(err.message)}</div>`;
    }
  }

  function populateDropdown() {
    const select = document.getElementById("story-selector");
    select.innerHTML = stories.map((s, idx) => {
      const sid = s.id || s.date || `story-${idx}`;
      const rating = feedbackMap[sid];
      let prefix = "";
      if (rating === 1) prefix = "👍 ";
      else if (rating === -1) prefix = "👎 ";

      const rawDate = s.date || "";
      const datePart = rawDate.includes(",") ? rawDate.split(",")[1].trim() : rawDate;
      const title = s.title || "Untitled";

      return `<option value="${escapeHtml(sid)}">${prefix}${escapeHtml(title)} (${escapeHtml(datePart)})</option>`;
    }).join("");
  }

  function onStorySelected(storyId) {
    const selected = stories.find(s => (s.id || s.date) === storyId);
    if (selected) {
      currentStory = selected;
      renderStory(currentStory);
      history.replaceState(null, "", `?story=${encodeURIComponent(storyId)}`);
    }
  }

  function renderStory(story) {
    const display = document.getElementById("story-display");
    const sid = story.id || story.date;
    const rating = feedbackMap[sid] || 0;

    const rawDate = story.date || "";
    const schemeBadge = story.rhyme_scheme ? `<span class="scheme-badge">${escapeHtml(story.rhyme_scheme)}</span>` : "";

    const versesHtml = (story.verses || []).map(v => {
      const lines = v.split("\n").map(l => `<span class="verse-line">${escapeHtml(l)}</span>`).join("");
      return `<div class="verse-card">${lines}</div>`;
    }).join("");

    display.innerHTML = `
      <header class="story-header">
        <h1 class="story-title">${escapeHtml(story.title || "Untitled Tale")}</h1>
        <div class="story-date-line">
          <span>🗓️ ${escapeHtml(rawDate)}</span>
          ${schemeBadge}
        </div>
      </header>

      <section class="verse-container">
        ${versesHtml}
      </section>

      <div class="feedback-area">
        <span class="feedback-label">Did the child enjoy this story?</span>
        <button class="btn-feedback ${rating === 1 ? 'active-like' : ''}" onclick="rateCurrentStory(1)" title="Thumbs Up">👍</button>
        <button class="btn-feedback ${rating === -1 ? 'active-dislike' : ''}" onclick="rateCurrentStory(-1)" title="Thumbs Down">👎</button>
      </div>
    `;
  }

  async function rateCurrentStory(ratingValue) {
    if (!currentStory) return;
    const sid = currentStory.id || currentStory.date;
    const currentRating = feedbackMap[sid] || 0;
    const newRating = currentRating === ratingValue ? 0 : ratingValue;

    feedbackMap[sid] = newRating;
    localStorage.setItem(`rating_${sid}`, newRating.toString());
    renderStory(currentStory);
    populateDropdown();
    document.getElementById("story-selector").value = sid;

    try {
      const res = await fetch(WORKER_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          action: "rate_story",
          story_id: sid,
          title: currentStory.title || "Untitled",
          rating: newRating
        })
      });

      if (res.ok) {
        showToast(newRating === 1 ? "Marked as 👍 Liked" : (newRating === -1 ? "Marked as 👎 Disliked" : "Rating removed"));
      }
    } catch (e) {
      showToast("Saved locally (offline). Will sync when online.");
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /* Pull to Refresh */
  (function initPullToRefresh() {
    const indicator = document.getElementById("ptr-indicator");
    const spinner = document.getElementById("ptr-spinner");

    let startY = 0;
    let currentY = 0;
    let isPulling = false;
    const PULL_THRESHOLD = 70;
    const MAX_PULL = 100;

    window.addEventListener("touchstart", (e) => {
      if (window.scrollY === 0) {
        startY = e.touches[0].pageY;
        isPulling = true;
      }
    }, { passive: true });

    window.addEventListener("touchmove", (e) => {
      if (!isPulling) return;
      currentY = e.touches[0].pageY;
      const distance = currentY - startY;

      if (distance > 0 && window.scrollY === 0) {
        const pullDistance = Math.min(distance * 0.4, MAX_PULL);
        indicator.style.transform = `translateY(${pullDistance}px)`;
        spinner.style.transform = `rotate(${pullDistance * 3.5}deg)`;
        if (e.cancelable) e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener("touchend", async () => {
      if (!isPulling) return;
      isPulling = false;

      const distance = currentY - startY;
      const pullDistance = distance * 0.4;

      if (pullDistance >= PULL_THRESHOLD && window.scrollY === 0) {
        indicator.style.transform = `translateY(${PULL_THRESHOLD}px)`;
        indicator.classList.add("ptr-loading");
        try {
          await initPage(true);
        } finally {
          setTimeout(() => {
            indicator.classList.remove("ptr-loading");
            indicator.style.transform = "translateY(-100%)";
          }, 350);
        }
      } else {
        indicator.style.transform = "translateY(-100%)";
      }
      startY = 0;
      currentY = 0;
    });
  })();

  /* Service Worker Registration with Automatic Background Update Checks */
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js")
        .then((reg) => {
          reg.update();
        })
        .catch((err) => console.warn("SW error:", err));
    });
  }

  document.addEventListener("DOMContentLoaded", () => {
    initPage(false);
  });
</script>

</body>
</html>
