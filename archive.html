<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Story Directory | Rory's Bedtime Tales</title>

  <!-- App Icon & Shortcut Settings -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <meta name="theme-color" content="#1a2f1a">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crete+Round&family=Vollkorn:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #1a2f1a;
      --card-bg: rgba(43, 66, 43, 0.85);
      --text-main: #f0ede6;
      --accent-title: #ffe16b;
      --text-muted: #a3b18a;
      --border: rgba(255, 255, 255, 0.1);
      --btn-bg: #3a5a40;
      --btn-hover: #588157;
      --select-bg: #243b24;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      background-color: var(--bg);
      overscroll-behavior-y: contain;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      background: radial-gradient(circle at top, #2d4a2d 0%, #1a2f1a 100%);
      color: var(--text-main);
      font-family: 'Vollkorn', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      box-sizing: border-box;
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
    }

    /* Pull-to-Refresh Indicator */
    .ptr-indicator {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateY(-100%);
      transition: transform 0.2s ease-out;
      z-index: 9999;
      pointer-events: none;
    }

    .ptr-spinner {
      width: 26px;
      height: 26px;
      border: 3px solid rgba(255, 225, 107, 0.2);
      border-top-color: var(--accent-title);
      border-radius: 50%;
      transition: transform 0.1s linear;
    }

    .ptr-loading .ptr-spinner {
      animation: ptr-spin 0.7s linear infinite;
    }

    @keyframes ptr-spin {
      to { transform: rotate(360deg); }
    }

    .container {
      max-width: 650px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
    }

    /* Centered Apple Touch Icon Logo */
    .header-logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .app-logo {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border);
      display: inline-block;
      object-fit: cover;
    }

    h1 {
      font-family: 'Crete Round', serif;
      font-size: 2.1rem;
      color: var(--accent-title);
      margin: 0 0 8px 0;
      text-align: center;
      line-height: 1.25;
    }

    p.subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 26px;
      font-size: 0.95rem;
    }

    /* Month Accordion Elements */
    details {
      background: rgba(26, 47, 26, 0.6);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 14px;
      overflow: hidden;
      transition: all 0.25s ease;
    }

    details:last-child {
      margin-bottom: 0;
    }

    details[open] {
      background: rgba(26, 47, 26, 0.92);
      border-color: rgba(255, 225, 107, 0.35);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    summary {
      font-family: 'Crete Round', serif;
      font-size: 1.12rem;
      color: var(--accent-title);
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }

    summary:hover {
      background: rgba(58, 90, 64, 0.35);
    }

    .active-badge {
      background: #3a5a40;
      color: #ffe16b;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-family: 'Vollkorn', serif;
      font-weight: bold;
      border: 1px solid var(--border);
    }

    .story-list {
      list-style: none;
      padding: 6px 16px 14px 16px;
      margin: 0;
    }

    .story-item {
      padding: 12px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .story-item:last-child {
      border-bottom: none;
    }

    .story-link {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      transition: color 0.2s;
    }

    .story-link:hover {
      color: var(--accent-title);
    }

    .story-date {
      color: var(--text-muted);
      font-size: 0.85rem;
      white-space: nowrap;
    }

    /* Bottom Navigation Bar */
    .bottom-bar {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    a.nav-link, button.nav-btn {
      color: var(--accent-title);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      background: var(--btn-bg);
      padding: 7px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s;
      font-family: 'Vollkorn', serif;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    a.nav-link:hover, button.nav-btn:hover {
      background: var(--btn-hover);
    }

    .status-msg {
      text-align: center;
      color: var(--text-muted);
      padding: 40px 10px;
      font-size: 1.05rem;
    }

    #status-toast {
      display: none;
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #2b422b;
      color: var(--accent-title);
      border: 1px solid rgba(255, 225, 107, 0.3);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      z-index: 10000;
    }
  </style>
</head>
<body>

<!-- Pull to Refresh Indicator -->
<div id="ptr-indicator" class="ptr-indicator">
  <div class="ptr-spinner" id="ptr-spinner"></div>
</div>

<div class="container">
  <!-- Centered Apple Touch Icon Logo -->
  <div class="header-logo">
    <img src="apple-touch-icon.png" alt="Rory Bedtime Story Logo" class="app-logo">
  </div>

  <div id="status-toast"></div>

  <h1>Story Directory</h1>
  <p class="subtitle">Browse every bedtime adventure by month</p>

  <!-- Accordion Directory Container -->
  <div id="directory-content">
    <p class="status-msg">Loading library...</p>
  </div>

  <!-- Bottom Navigation Links -->
  <div class="bottom-bar">
    <a href="index.html" class="nav-link">📖 Tonight's Story</a>
    <a href="status.html" class="nav-link">💚 System Status</a>
    <a href="admin.html" class="nav-link">⚙️ Admin</a>
    <button class="nav-btn" onclick="loadDirectory(true)">↻ Refresh</button>
  </div>
</div>

<script>
  function showToast(msg) {
    const toast = document.getElementById("status-toast");
    toast.textContent = msg;
    toast.style.display = "block";
    setTimeout(() => { toast.style.display = "none"; }, 3000);
  }

  async function loadDirectory(isManual = false) {
    const container = document.getElementById('directory-content');
    try {
      const res = await fetch('stories.json?nocache=' + Date.now());
      if (!res.ok) throw new Error("Could not load archive");
      const stories = await res.json();

      container.innerHTML = '';

      if (!stories || stories.length === 0) {
        container.innerHTML = '<p class="status-msg">No stories archived yet.</p>';
        return;
      }

      // Group stories by month_group
      const groups = {};
      stories.forEach(story => {
        const group = story.month_group || 'Earlier Tales';
        if (!groups[group]) groups[group] = [];
        groups[group].push(story);
      });

      let isFirstMonth = true;

      for (const [month, list] of Object.entries(groups)) {
        const details = document.createElement('details');
        details.open = isFirstMonth;

        const summary = document.createElement('summary');
        const badge = isFirstMonth ? '<span class="active-badge">Active</span>' : '';
        summary.innerHTML = `
          <span>🗓️ ${escapeHtml(month)} ${badge}</span>
          <span style="font-size:0.85rem; color:var(--text-muted); font-family:'Vollkorn',serif;">
            ${list.length} ${list.length === 1 ? 'tale' : 'tales'}
          </span>
        `;
        details.appendChild(summary);

        const ul = document.createElement('ul');
        ul.className = 'story-list';

        list.forEach(s => {
          const li = document.createElement('li');
          li.className = 'story-item';

          const link = document.createElement('a');
          link.className = 'story-link';
          link.href = `index.html?story=${encodeURIComponent(s.id || s.date)}`;
          link.textContent = s.title || 'Untitled Tale';

          const dateSpan = document.createElement('span');
          dateSpan.className = 'story-date';
          const rawDate = s.date || '';
          dateSpan.textContent = rawDate.includes(',') ? rawDate.split(',')[1].trim() : rawDate;

          li.appendChild(link);
          li.appendChild(dateSpan);
          ul.appendChild(li);
        });

        details.appendChild(ul);
        container.appendChild(details);

        isFirstMonth = false;
      }

      if (isManual) showToast("Archive refreshed!");
    } catch (err) {
      container.innerHTML = `<p class="status-msg" style="color: #f87171;">Failed to load story archive.<br><span style="font-size: 0.85rem; color: var(--text-muted);">${escapeHtml(err.message)}</span></p>`;
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /* Pull to Refresh */
  (function initPtr() {
    const indicator = document.getElementById('ptr-indicator');
    const spinner = document.getElementById('ptr-spinner');
    let startY = 0;
    let currentY = 0;
    let isPulling = false;
    const PULL_THRESHOLD = 70;
    const MAX_PULL = 100;

    window.addEventListener('touchstart', (e) => {
      if (window.scrollY === 0) {
        startY = e.touches[0].pageY;
        isPulling = true;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!isPulling) return;
      currentY = e.touches[0].pageY;
      const distance = currentY - startY;

      if (distance > 0 && window.scrollY === 0) {
        const pullDistance = Math.min(distance * 0.4, MAX_PULL);
        indicator.style.transform = `translateY(${pullDistance}px)`;
        spinner.style.transform = `rotate(${pullDistance * 3.5}deg)`;
        if (e.cancelable) e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchend', async () => {
      if (!isPulling) return;
      isPulling = false;

      const pullDistance = (currentY - startY) * 0.4;
      if (pullDistance >= PULL_THRESHOLD && window.scrollY === 0) {
        indicator.style.transform = `translateY(${PULL_THRESHOLD}px)`;
        indicator.classList.add('ptr-loading');
        try {
          await loadDirectory(true);
        } finally {
          setTimeout(() => {
            indicator.classList.remove('ptr-loading');
            indicator.style.transform = 'translateY(-100%)';
          }, 350);
        }
      } else {
        indicator.style.transform = 'translateY(-100%)';
      }
      startY = 0;
      currentY = 0;
    });
  })();

  document.addEventListener("DOMContentLoaded", () => {
    loadDirectory(false);
  });
</script>

</body>
</html>
