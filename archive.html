<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Story Directory | Rory's Bedtime Tales</title>

  <!-- App Icon & Shortcut Settings -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <meta name="theme-color" content="#1a2f1a">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style-theme.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crete+Round&family=Vollkorn:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
</head>
<body>

<!-- Pull to Refresh Indicator -->
<div id="ptr-indicator" class="ptr-indicator">
  <div class="ptr-spinner" id="ptr-spinner"></div>
</div>

<div class="container">
  <!-- Centered Apple Touch Icon Logo -->
  <div class="header-logo">
    <img src="apple-touch-icon.png" alt="Rory Bedtime Story Logo" class="app-logo">
  </div>

  <div id="status-toast"></div>

  <h1>Story Directory</h1>
  <p class="subtitle" id="archive-count">Browse every bedtime adventure by month</p>

  <!-- Search Input -->
  <input type="search" id="search-input" class="search-box" placeholder="🔍 Search stories by title or date..." oninput="applyFilters()">

  <!-- Filter Chips -->
  <div class="filter-bar">
    <button class="filter-chip active" data-filter="all" onclick="setFilter('all')">All Tales</button>
    <button class="filter-chip" data-filter="liked" onclick="setFilter('liked')">👍 Liked (<span id="count-liked">0</span>)</button>
    <button class="filter-chip" data-filter="disliked" onclick="setFilter('disliked')">👎 Disliked (<span id="count-disliked">0</span>)</button>
    <button class="filter-chip" data-filter="unrated" onclick="setFilter('unrated')">⚪ Unrated</button>
  </div>

  <!-- Accordion Directory Container -->
  <div id="directory-content">
    <p class="status-msg">Loading library...</p>
  </div>

  <!-- Bottom Navigation Links -->
  <div class="bottom-bar">
    <a href="index.html" class="nav-link">📖 Tonight's Story</a>
    <a href="status.html" class="nav-link">💚 System Status</a>
    <a href="admin.html" class="nav-link">⚙️ Admin</a>
    <button class="nav-btn" onclick="loadDirectory(true)">↻ Refresh</button>
  </div>
</div>

<script>
  const WORKER_ENDPOINT = "https://rory-trigger.stuartmckay.workers.dev";
  let allStories = [];
  let feedbackMap = {};
  let currentFilter = 'all';

  function showToast(msg) {
    const toast = document.getElementById("status-toast");
    toast.textContent = msg;
    toast.style.display = "block";
    setTimeout(() => { toast.style.display = "none"; }, 3000);
  }

  async function loadDirectory(isManual = false) {
    const container = document.getElementById('directory-content');
    try {
      // Concurrently fetch stories archive and D1 feedback ratings
      const [storiesRes, feedbackRes] = await Promise.all([
        fetch('stories.json?nocache=' + Date.now()),
        fetch(`${WORKER_ENDPOINT}/feedback-all`).catch(() => null)
      ]);

      if (!storiesRes.ok) throw new Error("Could not load archive");
      allStories = await storiesRes.json();

      if (feedbackRes && feedbackRes.ok) {
        feedbackMap = await feedbackRes.json();
      } else {
        feedbackMap = {};
        allStories.forEach(s => {
          const sid = s.id || s.date;
          const localVal = localStorage.getItem(`rating_${sid}`);
          if (localVal) feedbackMap[sid] = parseInt(localVal, 10);
        });
      }

      updateFilterCounts();
      applyFilters();

      if (isManual) showToast("Archive refreshed!");
    } catch (err) {
      container.innerHTML = `<p class="status-msg" style="color: #f87171;">Failed to load story archive.<br><span style="font-size: 0.85rem; color: var(--text-muted);">${escapeHtml(err.message)}</span></p>`;
    }
  }

  function updateFilterCounts() {
    let liked = 0;
    let disliked = 0;

    allStories.forEach(s => {
      const sid = s.id || s.date;
      const r = feedbackMap[sid];
      if (r === 1) liked++;
      if (r === -1) disliked++;
    });

    document.getElementById('count-liked').textContent = liked;
    document.getElementById('count-disliked').textContent = disliked;
    document.getElementById('archive-count').textContent = `${allStories.length} bedtime adventures recorded`;
  }

  function setFilter(type) {
    currentFilter = type;
    document.querySelectorAll('.filter-chip').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-filter') === type);
    });
    applyFilters();
  }

  function applyFilters() {
    const container = document.getElementById('directory-content');
    const query = (document.getElementById('search-input').value || '').toLowerCase().trim();

    if (!allStories || allStories.length === 0) {
      container.innerHTML = '<p class="status-msg">No stories archived yet.</p>';
      return;
    }

    // Filter stories based on search query & rating chip
    const filteredStories = allStories.filter(story => {
      const sid = story.id || story.date;
      const rating = feedbackMap[sid] || 0;
      const title = (story.title || '').toLowerCase();
      const date = (story.date || '').toLowerCase();

      // Search matching
      const matchesSearch = !query || title.includes(query) || date.includes(query);
      if (!matchesSearch) return false;

      // Rating filter matching
      if (currentFilter === 'liked') return rating === 1;
      if (currentFilter === 'disliked') return rating === -1;
      if (currentFilter === 'unrated') return !rating || rating === 0;
      return true;
    });

    if (filteredStories.length === 0) {
      container.innerHTML = '<p class="status-msg">No bedtime stories match your filter criteria.</p>';
      return;
    }

    // Group filtered stories by month_group
    const groups = {};
    filteredStories.forEach(story => {
      const group = story.month_group || 'Earlier Tales';
      if (!groups[group]) groups[group] = [];
      groups[group].push(story);
    });

    container.innerHTML = '';
    const isFilteredView = currentFilter !== 'all' || query.length > 0;
    let isFirstMonth = true;

    for (const [month, list] of Object.entries(groups)) {
      const details = document.createElement('details');
      // If user is searching/filtering, open all matched month groups automatically
      details.open = isFilteredView ? true : isFirstMonth;

      const summary = document.createElement('summary');
      const badge = (!isFilteredView && isFirstMonth) ? '<span class="active-badge">Active</span>' : '';
      summary.innerHTML = `
        <span>🗓️ ${escapeHtml(month)} ${badge}</span>
        <span style="font-size:0.85rem; color:var(--text-muted); font-family:ui-serif, -apple-system-ui-serif, 'New York', 'Vollkorn', serif;">
          ${list.length} ${list.length === 1 ? 'tale' : 'tales'}
        </span>
      `;
      details.appendChild(summary);

      const ul = document.createElement('ul');
      ul.className = 'story-list';

      list.forEach(s => {
        const sid = s.id || s.date;
        const rating = feedbackMap[sid];
        const rawDate = s.date || '';
        const datePart = rawDate.includes(',') ? rawDate.split(',')[1].trim() : rawDate;
        const schemeBadge = s.rhyme_scheme ? `<span class="scheme-badge">${escapeHtml(s.rhyme_scheme)}</span>` : '';

        let ratingBadgeHtml = '';
        if (rating === 1) {
          ratingBadgeHtml = '<span class="rating-pill" title="Liked">👍</span>';
        } else if (rating === -1) {
          ratingBadgeHtml = '<span class="rating-pill" title="Disliked">👎</span>';
        }

        const li = document.createElement('li');
        li.className = 'story-item';
        li.innerHTML = `
          <div class="story-link-group">
            <a class="story-link" href="index.html?story=${encodeURIComponent(sid)}">${escapeHtml(s.title || 'Untitled Tale')}</a>
            <div class="story-meta-tags">
              <span>${escapeHtml(datePart)}</span>
              ${schemeBadge}
            </div>
          </div>
          ${ratingBadgeHtml}
        `;
        ul.appendChild(li);
      });

      details.appendChild(ul);
      container.appendChild(details);

      isFirstMonth = false;
    }
  }

  function escapeHtml(str) {
    return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  /* Pull to Refresh */
  (function initPtr() {
    const indicator = document.getElementById('ptr-indicator');
    const spinner = document.getElementById('ptr-spinner');
    let startY = 0;
    let currentY = 0;
    let isPulling = false;
    const PULL_THRESHOLD = 70;
    const MAX_PULL = 100;

    window.addEventListener('touchstart', (e) => {
      if (window.scrollY === 0) {
        startY = e.touches[0].pageY;
        isPulling = true;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (!isPulling) return;
      currentY = e.touches[0].pageY;
      const distance = currentY - startY;

      if (distance > 0 && window.scrollY === 0) {
        const pullDistance = Math.min(distance * 0.4, MAX_PULL);
        indicator.style.transform = `translateY(${pullDistance}px)`;
        spinner.style.transform = `rotate(${pullDistance * 3.5}deg)`;
        if (e.cancelable) e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchend', async () => {
      if (!isPulling) return;
      isPulling = false;

      const pullDistance = (currentY - startY) * 0.4;
      if (pullDistance >= PULL_THRESHOLD && window.scrollY === 0) {
        indicator.style.transform = `translateY(${PULL_THRESHOLD}px)`;
        indicator.classList.add('ptr-loading');
        try {
          await loadDirectory(true);
        } finally {
          setTimeout(() => {
            indicator.classList.remove('ptr-loading');
            indicator.style.transform = 'translateY(-100%)';
          }, 350);
        }
      } else {
        indicator.style.transform = 'translateY(-100%)';
      }
      startY = 0;
      currentY = 0;
    });
  })();

  document.addEventListener("DOMContentLoaded", () => {
    loadDirectory(false);
  });
</script>

</body>
</html>
