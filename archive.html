<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Story Archive | Rory's Bedtime Tales</title>

  <!-- App Icon & Shortcut Settings -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <meta name="theme-color" content="#1a2f1a">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crete+Round&family=Vollkorn:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #1a2f1a;
      --card-bg: rgba(43, 66, 43, 0.85);
      --text-main: #f0ede6;
      --accent-title: #ffe16b;
      --text-muted: #a3b18a;
      --border: rgba(255, 255, 255, 0.1);
      --btn-bg: #3a5a40;
      --btn-hover: #588157;
    }

    body {
      margin: 0;
      padding: 30px 16px;
      background: radial-gradient(circle at top, #2d4a2d 0%, #1a2f1a 100%);
      color: var(--text-main);
      font-family: 'Vollkorn', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      box-sizing: border-box;
    }

    .container {
      max-width: 650px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    a.nav-link {
      color: var(--accent-title);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 600;
      background: var(--btn-bg);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: background 0.2s;
    }

    a.nav-link:hover {
      background: var(--btn-hover);
    }

    h1 {
      font-family: 'Crete Round', serif;
      font-size: 2.1rem;
      color: var(--accent-title);
      margin: 0 0 8px 0;
      text-align: center;
    }

    p.subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 28px;
      font-size: 0.95rem;
    }

    details {
      background: rgba(26, 47, 26, 0.6);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin-bottom: 14px;
      overflow: hidden;
      transition: all 0.25s ease;
    }

    details[open] {
      background: rgba(26, 47, 26, 0.92);
      border-color: rgba(255, 225, 107, 0.35);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
    }

    summary {
      font-family: 'Crete Round', serif;
      font-size: 1.15rem;
      color: var(--accent-title);
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background 0.2s;
    }

    summary:hover {
      background: rgba(58, 90, 64, 0.35);
    }

    .active-badge {
      background: #3a5a40;
      color: #ffe16b;
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      margin-left: 8px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      font-family: 'Vollkorn', serif;
      font-weight: bold;
    }

    .story-list {
      list-style: none;
      padding: 8px 16px 16px 16px;
      margin: 0;
    }

    .story-item {
      padding: 12px 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .story-item:last-child {
      border-bottom: none;
    }

    .story-link {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 600;
      font-size: 1.05rem;
      transition: color 0.2s;
    }

    .story-link:hover {
      color: var(--accent-title);
    }

    .story-date {
      color: var(--text-muted);
      font-size: 0.85rem;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <a href="index.html" class="nav-link">← Tonight's Story</a>
      <a href="status.html" class="nav-link">🩺 System Health</a>
      <span style="font-size: 1.4rem;">📚 🌿</span>
    </div>

    <h1>Story Directory</h1>
    <p class="subtitle">Browse every bedtime adventure by month</p>

    <div id="directory-content">
      <p style="text-align:center; color: var(--text-muted);">Loading library...</p>
    </div>
  </div>

  <script>
    fetch('stories.json?nocache=' + Date.now())
      .then(res => res.json())
      .then(stories => {
        const container = document.getElementById('directory-content');
        container.innerHTML = '';

        if (!stories || stories.length === 0) {
          container.innerHTML = '<p style="text-align:center;">No stories archived yet.</p>';
          return;
        }

        // Group stories by month_group (maintaining chronological order as they are prepended)
        const groups = {};
        stories.forEach(story => {
          const group = story.month_group || 'Earlier Tales';
          if (!groups[group]) groups[group] = [];
          groups[group].push(story);
        });

        // The first group encountered is the newest / active month
        let isFirstMonth = true;

        for (const [month, list] of Object.entries(groups)) {
          const details = document.createElement('details');

          // Active/latest month stays open; older months are collapsed
          if (isFirstMonth) {
            details.open = true;
          } else {
            details.open = false;
          }

          const summary = document.createElement('summary');
          const badge = isFirstMonth ? '<span class="active-badge">Active</span>' : '';
          summary.innerHTML = `
            <span>🗓️ ${month} ${badge}</span>
            <span style="font-size:0.85rem; color:var(--text-muted); font-family:'Vollkorn',serif;">
              ${list.length} ${list.length === 1 ? 'tale' : 'tales'}
            </span>
          `;
          details.appendChild(summary);

          const ul = document.createElement('ul');
          ul.className = 'story-list';

          list.forEach(s => {
            const li = document.createElement('li');
            li.className = 'story-item';

            const link = document.createElement('a');
            link.className = 'story-link';
            link.href = `index.html?story=${encodeURIComponent(s.id || s.date)}`;
            link.textContent = s.title;

            const dateSpan = document.createElement('span');
            dateSpan.className = 'story-date';
            dateSpan.textContent = s.date.split(',')[1] || s.date;

            li.appendChild(link);
            li.appendChild(dateSpan);
            ul.appendChild(li);
          });

          details.appendChild(ul);
          container.appendChild(details);

          isFirstMonth = false;
        }
      })
      .catch(() => {
        document.getElementById('directory-content').innerHTML = '<p style="text-align:center;">Failed to load story archive.</p>';
      });
  </script>
</body>
</html>
