<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rory Bedtime Story - Admin Console</title>
  <style>
    :root {
      --bg-color: #0b1120;
      --card-bg: #1e293b;
      --card-border: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-blue: #38bdf8;
      --accent-blue-hover: #0ea5e9;
      --success-bg: rgba(34, 197, 94, 0.15);
      --success-text: #4ade80;
      --warning-bg: rgba(234, 179, 8, 0.15);
      --warning-text: #facc15;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --danger-text: #f87171;
      --info-bg: rgba(56, 189, 248, 0.15);
      --info-text: #38bdf8;
      --purple-bg: rgba(168, 85, 247, 0.15);
      --purple-text: #c084fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      overscroll-behavior-y: contain;
      -webkit-overflow-scrolling: touch;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 32px 16px;
      line-height: 1.5;
    }

    /* Pull-to-Refresh Indicator */
    .ptr-indicator {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateY(-100%);
      transition: transform 0.2s ease-out;
      z-index: 9999;
      pointer-events: none;
    }

    .ptr-spinner {
      width: 26px;
      height: 26px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: var(--accent-blue);
      border-radius: 50%;
      transition: transform 0.1s linear;
    }

    .ptr-loading .ptr-spinner {
      animation: ptr-spin 0.7s linear infinite;
    }

    @keyframes ptr-spin {
      to { transform: rotate(360deg); }
    }

    .container {
      max-width: 1020px;
      margin: 0 auto;
    }

    /* Top Navigation Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .header-title h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .header-title p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 4px;
    }

    .action-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      text-decoration: none;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.15s ease-in-out;
    }

    .btn-primary {
      background: var(--accent-blue);
      color: #0b1120;
    }

    .btn-primary:hover {
      background: var(--accent-blue-hover);
    }

    .btn-secondary {
      background: var(--card-bg);
      color: var(--text-main);
      border-color: var(--card-border);
    }

    .btn-secondary:hover {
      background: #283548;
      border-color: #475569;
    }

    .btn-danger {
      background: var(--danger-bg);
      color: var(--danger-text);
      border-color: rgba(239, 68, 68, 0.3);
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.25);
    }

    .btn-disabled {
      opacity: 0.4;
      cursor: not-allowed !important;
      pointer-events: none;
    }

    /* Auth Gate Screen */
    #auth-screen {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 70vh;
    }

    .auth-gate-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 32px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .auth-gate-card h2 {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .auth-gate-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Main Console Screen */
    #admin-main {
      display: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 18px 20px;
    }

    .stat-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .stat-value {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .admin-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.2);
    }

    .card-header-flex {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 16px;
    }

    .card-header-text h2 {
      font-size: 1.15rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .card-header-text p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .input-text {
      width: 100%;
      background: #141c2e;
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .input-text:focus {
      border-color: var(--accent-blue);
    }

    .batch-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #172033;
      border: 1px solid var(--card-border);
      padding: 10px 16px;
      border-radius: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .table-responsive {
      overflow-x: auto;
    }

    .admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.875rem;
    }

    .admin-table th {
      background: #141c2e;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      padding: 12px 16px;
      border-bottom: 1px solid var(--card-border);
    }

    .admin-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--card-border);
      color: var(--text-main);
      vertical-align: middle;
    }
