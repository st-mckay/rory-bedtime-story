<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Archive Manager | Rory's Bedtime Tales</title>

  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Crete+Round&family=Vollkorn:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #1a2f1a;
      --card-bg: rgba(43, 66, 43, 0.88);
      --text-main: #f0ede6;
      --accent-title: #ffe16b;
      --text-muted: #a3b18a;
      --border: rgba(255, 255, 255, 0.12);
      --btn-bg: #3a5a40;
      --btn-hover: #588157;
      --btn-danger: #a83232;
      --btn-danger-hover: #c93b3b;
    }

    body {
      margin: 0;
      padding: 24px 8px 60px 8px;
      background: radial-gradient(circle at top, #2d4a2d 0%, #1a2f1a 100%);
      color: var(--text-main);
      font-family: 'Vollkorn', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      box-sizing: border-box;
    }

    .container {
      max-width: 680px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 28px 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
      box-sizing: border-box;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 10px;
    }

    a.nav-link, button.nav-btn {
      color: var(--accent-title);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      background: var(--btn-bg);
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      cursor: pointer;
      font-family: 'Vollkorn', serif;
      transition: background 0.2s;
    }

    a.nav-link:hover, button.nav-btn:hover {
      background: var(--btn-hover);
    }

    h1 {
      font-family: 'Crete Round', serif;
      font-size: clamp(1.6rem, 5vw, 2.1rem);
      color: var(--accent-title);
      margin: 0 0 6px 0;
      text-align: center;
    }

    p.subtitle {
      text-align: center;
      color: var(--text-muted);
      margin-bottom: 20px;
      font-size: 0.9rem;
    }

    /* Lock Screen Gate */
    #lockScreen {
      padding: 40px 20px;
      text-align: center;
    }

    .lock-input {
      background: rgba(26, 47, 26, 0.8);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 16px;
      text-align: center;
      width: 200px;
      font-family: 'Vollkorn', serif;
    }

    /* Batch Controls Toolbar */
    .batch-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(26, 47, 26, 0.9);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
      margin-bottom: 20px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .batch-selection-info {
      font-size: 0.88rem;
      color: var(--accent-title);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .batch-actions {
      display: flex;
      gap: 8px;
    }

    /* Month Accordion */
    .month-group {
      margin-bottom: 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(26, 47, 26, 0.4);
    }

    .month-header {
      padding: 12px 16px;
      background: rgba(43, 66, 43, 0.9);
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--accent-title);
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      user-select: none;
    }

    .month-header:hover {
      background: rgba(58, 90, 64, 0.8);
    }

    .month-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .story-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px;
    }

    .story-item {
      background: rgba(26, 47, 26, 0.7);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .story-item.selected {
      border-color: var(--accent-title);
      background: rgba(58, 90, 64, 0.4);
    }

    .story-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      text-align: left;
    }

    .story-checkbox {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--btn-hover);
    }

    .story-info {
      flex: 1;
    }

    .story-title {
      font-weight: 600;
      font-size: 0.98rem;
      color: var(--text-main);
      margin-bottom: 2px;
    }

    .story-date {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .story-actions {
      display: flex;
      gap: 6px;
    }

    .btn-edit {
      background: var(--btn-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: 'Vollkorn', serif;
    }

    .btn-edit:hover {
      background: var(--btn-hover);
    }

    .btn-danger {
      background: var(--btn-danger);
      color: #fff;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 0.8rem;
      cursor: pointer;
      font-family: 'Vollkorn', serif;
    }

    .btn-danger:hover {
      background: var(--btn-danger-hover);
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="top-bar">
      <a href="archive.html" class="nav-link">← Directory</a>
      <button class="nav-btn" onclick="logoutAdmin()" id="logoutBtn" style="display:none;">🔒 Lock</button>
    </div>

    <h1>Archive Admin</h1>
    <p class="subtitle">Organize, rename, or batch delete tales by monthly collection</p>

    <!-- Locked Gate View -->
    <div id="lockScreen">
      <p style="color: var(--accent-title); font-size: 1.1rem; margin-bottom: 14px;">Enter Admin Passcode</p>
      <form onsubmit="handleLogin(event)">
        <input type="password" id="passcodeInput" class="lock-input" placeholder="Passcode" autocomplete="current-password" required><br>
        <button type="submit" class="btn-edit" style="font-size: 0.95rem; padding: 8px 18px;">Unlock Session</button>
      </form>
    </div>

    <!-- Authenticated Content Area -->
    <div id="adminApp" style="display: none;">
      <!-- Batch Selection Toolbar -->
      <div class="batch-bar">
        <div class="batch-selection-info">
          <input type="checkbox" id="selectAllGlobal" onchange="toggleSelectAll(this.checked)" class="story-checkbox">
          <span id="selectedCountText">0 selected</span>
        </div>
        <div class="batch-actions">
          <button class="btn-danger" id="deleteSelectedBtn" onclick="deleteSelectedStories()" disabled>🗑️ Delete Selected</button>
        </div>
      </div>

      <!-- Monthly Groups Container -->
      <div id="accordionContainer">
        <p style="text-align:center; color: var(--text-muted);">Loading archived stories...</p>
      </div>
    </div>
  </div>

  <script>
    const WORKER_URL = "https://rory-trigger.stuartmckay.workers.dev";
    let stories = [];
    const selectedStoryIds = new Set();
    let currentAdminKey = sessionStorage.getItem('rory_session_key') || '';

    async function handleLogin(e) {
      if (e) e.preventDefault();
      const input = document.getElementById('passcodeInput');
      const pass = input.value.trim();
      if (!pass) return;

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-key': pass
          },
          body: JSON.stringify({ action: 'verify_auth' })
        });

        if (res.ok) {
          currentAdminKey = pass;
          sessionStorage.setItem('rory_session_key', pass);
          showAdminView();
          loadStories();
        } else {
          alert("Invalid passcode. Access denied.");
          input.value = '';
          input.focus();
        }
      } catch (err) {
        alert("Verification error: " + err.message);
      }
    }

    function showAdminView() {
      document.getElementById('lockScreen').style.display = 'none';
      document.getElementById('adminApp').style.display = 'block';
      document.getElementById('logoutBtn').style.display = 'inline-block';
    }

    function logoutAdmin() {
      sessionStorage.removeItem('rory_session_key');
      currentAdminKey = '';
      document.getElementById('adminApp').style.display = 'none';
      document.getElementById('logoutBtn').style.display = 'none';
      document.getElementById('lockScreen').style.display = 'block';
      document.getElementById('passcodeInput').value = '';
    }

    async function loadStories() {
      const container = document.getElementById('accordionContainer');
      container.innerHTML = '<p style="text-align:center; color: var(--text-muted);">Loading archived stories...</p>';

      try {
        const res = await fetch('stories.json?nocache=' + Date.now());
        if (!res.ok) throw new Error("Could not fetch archive file");
        stories = await res.json();
        selectedStoryIds.clear();
        updateBatchBar();
        renderMonthlyGroups();
      } catch (err) {
        container.innerHTML = `<p style="text-align:center; color:#f44336;">Failed to load archive: ${err.message}</p>`;
      }
    }

    function getMonthKey(story) {
      if (story.month_group) return story.month_group;
      if (story.date) {
        const parts = story.date.split(',');
        if (parts.length >= 2) {
          const datePart = parts[1].trim();
          const tokens = datePart.split(' ');
          if (tokens.length >= 2) {
            const m = tokens[0].substring(0, 3);
            const y = (tokens[tokens.length - 1] || '').slice(-2);
            return `${m}-${y}`;
          }
        }
      }
      return 'Other';
    }

    function renderMonthlyGroups() {
      const container = document.getElementById('accordionContainer');
      if (!stories || stories.length === 0) {
        container.innerHTML = '<p style="text-align:center; color: var(--text-muted);">No stories catalogued.</p>';
        return;
      }

      const groups = {};
      stories.forEach(s => {
        const key = getMonthKey(s);
        if (!groups[key]) groups[key] = [];
        groups[key].push(s);
      });

      container.innerHTML = '';
      const groupKeys = Object.keys(groups);

      groupKeys.forEach((key, index) => {
        const monthDiv = document.createElement('div');
        monthDiv.className = 'month-group';

        const monthStories = groups[key];
        const isFirst = index === 0;

        monthDiv.innerHTML = `
          <div class="month-header" onclick="toggleAccordion('content-${key}', 'icon-${key}')">
            <div class="month-title">
              <span id="icon-${key}">${isFirst ? '▼' : '▶'}</span>
              <span>${key} (${monthStories.length})</span>
            </div>
            <button class="btn-edit" onclick="event.stopPropagation(); selectMonthStories('${key}')" style="font-size: 0.75rem;">Select All</button>
          </div>
          <div class="story-list" id="content-${key}" style="display: ${isFirst ? 'flex' : 'none'};">
            ${monthStories.map(s => {
              const sId = s.id || s.date;
              return `
                <div class="story-item" id="item-${sId}">
                  <div class="story-left">
                    <input type="checkbox" class="story-checkbox story-check-item" value="${sId}" onchange="toggleStorySelect('${sId}', this.checked)">
                    <div class="story-info">
                      <div class="story-title" id="title-${sId}">${s.title || 'Untitled'}</div>
                      <div class="story-date">${s.date || ''}</div>
                    </div>
                  </div>
                  <div class="story-actions">
                    <button class="btn-edit" onclick="renameStory('${sId}', '${(s.title || '').replace(/'/g, "\\'")}')">✏️</button>
                    <button class="btn-danger" onclick="deleteSingleStory('${sId}', '${(s.title || '').replace(/'/g, "\\'")}')">🗑️</button>
                  </div>
                </div>
              `;
            }).join('')}
          </div>
        `;
        container.appendChild(monthDiv);
      });
    }

    function toggleAccordion(contentId, iconId) {
      const content = document.getElementById(contentId);
      const icon = document.getElementById(iconId);
      if (content.style.display === 'none') {
        content.style.display = 'flex';
        icon.innerText = '▼';
      } else {
        content.style.display = 'none';
        icon.innerText = '▶';
      }
    }

    function toggleStorySelect(storyId, isChecked) {
      const itemEl = document.getElementById(`item-${storyId}`);
      if (isChecked) {
        selectedStoryIds.add(storyId);
        if (itemEl) itemEl.classList.add('selected');
      } else {
        selectedStoryIds.delete(storyId);
        if (itemEl) itemEl.classList.remove('selected');
      }
      updateBatchBar();
    }

    function toggleSelectAll(isChecked) {
      const checkboxes = document.querySelectorAll('.story-check-item');
      checkboxes.forEach(cb => {
        cb.checked = isChecked;
        const storyId = cb.value;
        const itemEl = document.getElementById(`item-${storyId}`);
        if (isChecked) {
          selectedStoryIds.add(storyId);
          if (itemEl) itemEl.classList.add('selected');
        } else {
          selectedStoryIds.delete(storyId);
          if (itemEl) itemEl.classList.remove('selected');
        }
      });
      updateBatchBar();
    }

    function selectMonthStories(monthKey) {
      const container = document.getElementById(`content-${monthKey}`);
      if (!container) return;
      const checkboxes = container.querySelectorAll('.story-check-item');
      const allChecked = Array.from(checkboxes).every(cb => cb.checked);

      checkboxes.forEach(cb => {
        cb.checked = !allChecked;
        const storyId = cb.value;
        const itemEl = document.getElementById(`item-${storyId}`);
        if (!allChecked) {
          selectedStoryIds.add(storyId);
          if (itemEl) itemEl.classList.add('selected');
        } else {
          selectedStoryIds.delete(storyId);
          if (itemEl) itemEl.classList.remove('selected');
        }
      });
      updateBatchBar();
    }

    function updateBatchBar() {
      const count = selectedStoryIds.size;
      document.getElementById('selectedCountText').innerText = `${count} selected`;
      document.getElementById('deleteSelectedBtn').disabled = (count === 0);
      document.getElementById('selectAllGlobal').checked = (count > 0 && count === stories.length);
    }

    async function renameStory(storyId, currentTitle) {
      const newTitle = prompt("Enter new title for this story:", currentTitle);
      if (!newTitle || newTitle.trim() === "" || newTitle.trim() === currentTitle) return;

      const titleEl = document.getElementById(`title-${storyId}`);
      const oldText = titleEl.innerText;
      titleEl.innerText = "⏳ Saving...";

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-key': currentAdminKey
          },
          body: JSON.stringify({
            action: 'rename',
            id: storyId,
            new_title: newTitle.trim()
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || `HTTP ${res.status}`);
        }

        titleEl.innerText = newTitle.trim();
      } catch (err) {
        titleEl.innerText = oldText;
        alert("Failed to rename story: " + err.message);
      }
    }

    async function deleteSingleStory(storyId, title) {
      const confirmDelete = confirm(`Are you sure you want to permanently delete:\n"${title}"?`);
      if (!confirmDelete) return;

      const itemEl = document.getElementById(`item-${storyId}`);
      if (itemEl) itemEl.style.opacity = "0.4";

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-key': currentAdminKey
          },
          body: JSON.stringify({
            action: 'delete',
            id: storyId
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || `HTTP ${res.status}`);
        }

        loadStories();
      } catch (err) {
        if (itemEl) itemEl.style.opacity = "1";
        alert("Failed to delete story: " + err.message);
      }
    }

    async function deleteSelectedStories() {
      const count = selectedStoryIds.size;
      if (count === 0) return;

      const confirmBatch = confirm(`Are you sure you want to permanently delete all ${count} selected stories?`);
      if (!confirmBatch) return;

      const deleteBtn = document.getElementById('deleteSelectedBtn');
      deleteBtn.innerText = "⏳ Deleting...";
      deleteBtn.disabled = true;

      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'x-admin-key': currentAdminKey
          },
          body: JSON.stringify({
            action: 'delete_batch',
            ids: Array.from(selectedStoryIds)
          })
        });

        if (!res.ok) {
          const errData = await res.json().catch(() => ({}));
          throw new Error(errData.error || `HTTP ${res.status}`);
        }

        loadStories();
      } catch (err) {
        deleteBtn.innerText = "🗑️ Delete Selected";
        deleteBtn.disabled = false;
        alert("Failed to delete selected stories: " + err.message);
      }
    }

    // Auto-verify if session key already exists in memory
    if (currentAdminKey) {
      fetch(WORKER_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-key': currentAdminKey },
        body: JSON.stringify({ action: 'verify_auth' })
      }).then(res => {
        if (res.ok) {
          showAdminView();
          loadStories();
        } else {
          logoutAdmin();
        }
      }).catch(() => logoutAdmin());
    }
  </script>
</body>
</html>
