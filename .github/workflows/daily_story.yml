name: Generate Daily Bedtime Story

on:
  schedule:
    # 17:00 UTC = 18:00 (6:00 PM) BST / 17:00 (5:00 PM) GMT
    - cron: '0 17 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [generate-story]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai

      - name: Generate Bedtime Story
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_story.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add story.json stories.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Add bedtime story for $(date '+%Y-%m-%d')" && git push)
